name: ci-nightly
on: 
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' #every midnight UTC

jobs:
  replay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run replay + unit tests (skip live)
        run: pytest -m "not live" -q
      - name: Upload artefacts (flags)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-flags
          path: replay_output.json
      - name: Slack alert on failure
        if: failure()
        run:  |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"X nightly replay failed on joat-trading-system"}' \
          ${{ secrets.SLACK_WEBHOOK }}